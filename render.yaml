# Render Blueprint — deploys the whole WithCare stack from this repo.
# Render dashboard → New → Blueprint → pick this repo. See DEPLOY-RENDER.md.

services:
  # ── Backend: FastAPI in Docker ──────────────────────────────────────────────
  - type: web
    name: withcare-backend
    runtime: docker
    plan: free                      # free = no persistent disk (SQLite resets on restart)
    region: singapore               # closest Render region to India
    dockerfilePath: ./withcare-backend/Dockerfile
    dockerContext: ./withcare-backend
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - withcare-backend/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_LOCATION
        value: us-central1
      # Google credentials come from Render "Secret Files" (mounted under /etc/secrets).
      # Upload service-account.json and token.json there after the first deploy.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json
      - key: WITHCARE_TOKEN_PATH
        value: /etc/secrets/token.json
      - key: WITHCARE_DB_PATH
        value: /tmp/withcare/withcare.db   # switch to /var/data/withcare.db if you add the disk below
      # Values you enter in the dashboard (prompted on first Blueprint deploy):
      - key: GCP_PROJECT_ID
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
    # To keep the SQLite data across restarts, change plan to "starter" (paid),
    # uncomment this, and set WITHCARE_DB_PATH=/var/data/withcare.db:
    # disk:
    #   name: withcare-db
    #   mountPath: /var/data
    #   sizeGB: 1

  # ── Frontend: Vite static site ──────────────────────────────────────────────
  - type: web
    name: withcare-frontend
    runtime: static
    rootDir: withcare-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - withcare-frontend/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Full backend URL, e.g. https://withcare-backend.onrender.com (no trailing slash).
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
